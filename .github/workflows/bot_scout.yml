name: Crypto Scouting Bot Cron

on:
  schedule:
    # Berjalan otomatis setiap 15 menit sekali
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions GitHub

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Crypto Scout Bot
      run: python bot.py
